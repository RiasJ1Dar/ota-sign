[package]
name = "ota-sign"
version = "0.1.1"
edition = "2021"
description = "Incremental OTA: Ed25519-signed manifest and content-addressed blobs"
license = "MIT"
repository = "https://github.com/RiasJ1Dar/ota-sign"
readme = "README.md"
keywords = ["ota", "updates", "ed25519", "blobs"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
hex = "0.4"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
